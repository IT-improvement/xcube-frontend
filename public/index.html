<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XCube — 위성 데이터를 작게, 지도에서</title>
    <meta
      name="description"
      content="위성 영상은 작게 보관하고, 필요한 곳과 날짜만 지도에서 봅니다. 시점별 Viewer, 수식 융합, AI 수체 추출과 원본 대비 비교를 한곳에서 합니다."
    />
    <!-- theme-color = field-book ground token (--fb-ground, src/styles/fieldbook.css). -->
    <meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Hero image preload, home page only. The home hero (LandingPage, <picture>) is the LCP image;
      without this it starts downloading only after the JS bundle runs. A static <link rel="preload">
      would also fetch it on /login and /app/*, so this inline script adds it only for "/".
      The media queries match the <picture> source in LandingPage.tsx (MOBILE_QUERY).
    -->
    <script>
      (function () {
        var base = '%PUBLIC_URL%';
        var path = window.location.pathname.slice(base.length) || '/';
        if (path !== '/') return;
        [
          ['(max-width: 767px)', 'daecheong-swipe.webp'],
          ['not all and (max-width: 767px)', 'daecheong-viewer.webp'],
        ].forEach(function (item) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.media = item[0];
          link.href = base + '/landing/' + item[1];
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        });
      })();
    </script>
    <!-- Pretendard Variable (dynamic subset, font-display: swap); the family is --fb-font. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <noscript>XCube를 쓰려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
